id: P1-02
category: p1
introduced: "0.135"
title: "sapm Receiver Removed"
look_for:
  - path: $.receivers.sapm
    match: exists
  - path: $.receivers.sapm
    match: exists
    in_comments: true
migration:
  strategy: auto
  key_moves:
    # Delete the sapm receiver definition — its presence causes startup failure.
    - from: $.receivers.sapm
      to: ""
    # Remove 'sapm' from every pipeline receiver array.
    - sequence_path: $.service.pipelines.*.receivers
      old_value: sapm
      new_value: ""
  before: |
    receivers:
      sapm:
        endpoint: 0.0.0.0:7276
    service:
      pipelines:
        traces:
          receivers: [sapm]
  after: |
    # sapm receiver and all pipeline references removed automatically.
    # Add the otlp receiver manually:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    service:
      pipelines:
        traces:
          receivers: [otlp]   # update manually
guidance: |
  Remove the sapm receiver definition entirely and replace it with the otlp receiver.
  Update any pipeline receivers lists to reference otlp instead of sapm.
  Agents or SDKs that were pushing SAPM to port 7276 must be reconfigured to send OTLP
  to port 4317 (gRPC) or 4318 (HTTP).
description: >-
  The sapm receiver was removed in 0.135. Any config that defines a sapm receiver will
  cause the collector to fail to start. The engine automatically removes the sapm receiver
  definition and cleans up all pipeline receiver references. Replace with the otlp receiver
  manually — endpoint and protocol selection are deployment-specific.
see_also:
  - P1-03
