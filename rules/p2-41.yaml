  This does not require YAML config changes unless downstream pipelines or dashboards rely on
  otel_scope_info metrics. To temporarily restore the previous behavior, disable the gate with
  --feature-gates=-receiver.prometheusreceiver.IgnoreScopeInfoMetric.
