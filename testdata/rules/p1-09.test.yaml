cases:
  - name: "fires when kafka receiver has topic field"
    config: |
      receivers:
        kafka:
          brokers: [kafka:9092]
          topic: otel-spans
    should_fire: true

  - name: "fires when kafka receiver has exclude_topic field"
    config: |
      receivers:
        kafka:
          brokers: [kafka:9092]
          exclude_topic: internal-.*
    should_fire: true

  - name: "fires when kafka receiver has default_fetch_size"
    config: |
      receivers:
        kafka:
          brokers: [kafka:9092]
          default_fetch_size: 1048576
    should_fire: true

  - name: "silent when kafka receiver has none of the removed fields"
    config: |
      receivers:
        kafka:
          brokers: [kafka:9092]
          client_id: otel-collector
    should_fire: false
