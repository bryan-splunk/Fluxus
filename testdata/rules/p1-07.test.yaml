cases:
  - name: "fires when splunk_hec exporter has batcher block and migrates it"
    config: |
      exporters:
        splunk_hec:
          token: abc123
          endpoint: https://hec.example.com
          batcher:
            min_size_items: 80
            min_size_bytes: 512
    should_fire: true
    apply_contains:
      - "sending_queue:"
      - "batch:"
    apply_not_contains:
      - "batcher:"

  - name: "silent when splunk_hec has no batcher"
    config: |
      exporters:
        splunk_hec:
          token: abc123
          endpoint: https://hec.example.com
    should_fire: false
