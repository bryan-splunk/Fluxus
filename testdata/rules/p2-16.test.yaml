# P2-16 only fires when prometheus appears in a COMMENTED-OUT block.
# The engine needs --include-comments flag or in_comments:true look_for to trigger.
# We test the basic: it does NOT fire on a live config (no comments).
cases:
  - name: "silent when prometheus present as live config (no in_comments match)"
    config: |
      receivers:
        prometheus:
          config:
            scrape_configs:
              - job_name: my-app
                static_configs:
                  - targets: ["localhost:8080"]
    should_fire: false

  - name: "silent when prometheus absent"
    config: |
      receivers:
        otlp: {}
    should_fire: false
