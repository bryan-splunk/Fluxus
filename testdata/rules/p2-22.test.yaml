cases:
  - name: "fires when exporter has http_client_config.max_idle_conns"
    config: |
      exporters:
        otlphttp:
          endpoint: https://otelcol:4318
          http_client_config:
            max_idle_conns: 100
    should_fire: true

  - name: "fires when exporter has http_client_config.idle_conn_timeout"
    config: |
      exporters:
        otlphttp:
          endpoint: https://otelcol:4318
          http_client_config:
            idle_conn_timeout: 90s
    should_fire: true

  - name: "silent when no http_client_config connection fields"
    config: |
      exporters:
        otlphttp:
          endpoint: https://otelcol:4318
    should_fire: false
