cases:
  - name: "fires when k8s_objects receiver present"
    config: |
      receivers:
        k8s_objects:
          objects:
            - name: pods
              mode: pull
    should_fire: true

  - name: "fires when k8sobjects receiver present"
    config: |
      receivers:
        k8sobjects:
          objects:
            - name: pods
              mode: pull
    should_fire: true

  - name: "silent when neither present"
    config: |
      receivers:
        otlp: {}
    should_fire: false
