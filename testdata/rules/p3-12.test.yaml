cases:
  - name: "fires when k8s_attributes present"
    config: |
      processors:
        k8s_attributes:
          passthrough: false
    should_fire: true

  - name: "fires when k8sattributes present"
    config: |
      processors:
        k8sattributes:
          passthrough: false
    should_fire: true

  - name: "silent when neither present"
    config: |
      processors:
        batch: {}
    should_fire: false
