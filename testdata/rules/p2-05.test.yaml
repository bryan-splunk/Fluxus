cases:
  - name: "fires when resource_detection processor present"
    config: |
      processors:
        resource_detection:
          detectors: [env, system]
    should_fire: true

  - name: "fires when resourcedetection processor present"
    config: |
      processors:
        resourcedetection:
          detectors: [env]
    should_fire: true

  - name: "silent when neither present"
    config: |
      processors:
        batch: {}
    should_fire: false
