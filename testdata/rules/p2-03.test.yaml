cases:
  - name: "fires when kafkametrics present"
    config: |
      receivers:
        kafkametrics:
          brokers: [kafka:9092]
          collection_interval: 10s
    should_fire: true

  - name: "fires when kafka_metrics present"
    config: |
      receivers:
        kafka_metrics:
          brokers: [kafka:9092]
    should_fire: true

  - name: "silent when neither present"
    config: |
      receivers:
        otlp: {}
    should_fire: false
