## Sample gateway config used for unit tests.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 2000
    spike_limit_mib: 400

  batch:
    timeout: 10s
    send_batch_size: 8192

  resource:
    attributes:
      - action: insert
        key: deployment.environment
        value: "${DEPLOYMENT_ENV}"

exporters:
  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: us0

  prometheusremotewrite:
    endpoint: "https://prometheus.example.com/api/v1/write"
    export_created_metric: true  # C-N7: removed in 0.123

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8889
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [signalfx]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [signalfx, prometheusremotewrite]
