## Sample agent config used for unit tests.
## Intentionally contains several breaking change patterns for testing rule detection.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

  kafka:
    brokers: [kafka:9092]
    topic: otel-traces
    # client_id is not explicitly set — will pick up the new default "otel-collector" in 0.130

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 10s
    send_batch_size: 1024

  # routing processor — needs migration to routing connector (removed 0.134)
  # routing:
  #   from_attribute: X-Tenant
  #   table:
  #     - value: "acme"
  #       exporters: [otlp/acme]

exporters:
  otlp:
    endpoint: gateway:4317
    tls:
      insecure: true
    sending_queue:
      blocking: true  # C-19: removed in 0.129 — use block_on_overflow

  signalfx:
    access_token: "${SPLUNK_ACCESS_TOKEN}"
    realm: us0

service:
  extensions: [health_check]
  telemetry:
    address: 0.0.0.0:8888  # C-N4: silently ignored in 0.123+ — use readers: format
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp, signalfx]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [otlp, signalfx]
